name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          # 文档站的「最后更新」读提交时间，浅克隆取不到
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm

      - name: 安装依赖
        # CI 在海外节点跑，本地 .npmrc 的镜像不适合，这里直连官方源
        run: npm ci --registry=https://registry.npmjs.org

      - name: 格式检查
        run: npm run format:check

      - name: 运行校验
        run: npm run verify

      - name: 覆盖率门槛
        run: npm run test:coverage

      - name: 生产依赖审计
        run: npm run audit:prod

      - name: 留存构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: 端到端冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmjs.org

      - name: 安装浏览器
        run: npx playwright install --with-deps chromium

      - name: 运行冒烟
        run: npm run test:e2e

      - name: 留存失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
